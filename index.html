<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoZona.ge</title>
  <meta name="description" content="ავტონაწილების კატალოგი — მოძებნე და გაფილტრე კატეგორიების მიხედვით">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="theme.js?v=3"></script>
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="./" id="logo">
        <img class="logo-img" id="logo-img" alt="" hidden>
        <span class="logo-mark" aria-hidden="true">⚙</span>
        <span id="site-title">AutoZona.ge</span>
      </a>
      <p class="tagline" id="site-tagline">ნაწილების კატალოგი</p>
      <button class="theme-toggle" type="button" data-theme-toggle>☾</button>
    </div>
  </header>

  <main class="wrap">

    <section class="controls">
      <label class="search" for="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search" placeholder="მოძებნე ნაწილი…" autocomplete="off">
      </label>

      <nav class="filters" id="filters" aria-label="კატეგორიები"></nav>
    </section>

    <p class="result-count" id="count"></p>

    <section class="grid" id="grid"></section>

    <p class="empty" id="empty" hidden>
      ვერაფერი მოიძებნა 🙁<br>
      <span>სცადე სხვა სიტყვა ან აირჩიე „ყველა“</span>
    </p>

  </main>

  <dialog class="lightbox" id="lightbox" aria-label="სურათი">
    <button class="lightbox-close" type="button" id="lightbox-close"
            aria-label="დახურვა">✕</button>
    <button class="lightbox-nav lightbox-prev" type="button" id="lightbox-prev"
            aria-label="წინა ფოტო" hidden>‹</button>
    <img class="lightbox-img" id="lightbox-img" alt="">
    <button class="lightbox-nav lightbox-next" type="button" id="lightbox-next"
            aria-label="შემდეგი ფოტო" hidden>›</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
    <span class="lightbox-counter" id="lightbox-counter" hidden></span>
  </dialog>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> <span id="site-title-footer">AutoZona.ge</span></p>
    </div>
  </footer>

  <script src="logo.js?v=3"></script>
  <script src="data.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
